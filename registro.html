
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Emprendimiento May</title>

    <link rel="stylesheet" href="css/registro.css">

    <script type="module" src="js/auth.js"></script>
</head>

<body>

    <main class="contenedor-registro">

        <section class="panel-formulario">

            <div class="contenido-registro">

                <a href="login.html" class="volver">
                    ← Volver al login
                </a>

                <div class="marca">
                    <h1>EMPRENDIMIENTO MAY</h1>
                    <span>PERFUMERÍA</span>
                </div>

                <p class="subtitulo">BIENVENIDO/A</p>

                <h2>Crear cuenta</h2>

                <p class="descripcion">
                    Registrate para descubrir nuestros perfumes.
                </p>

                <form id="form-registro">

                    <div class="grupo-input">
                        <label for="nombre">Nombre completo</label>

                        <input
                            type="text"
                            id="nombre"
                            placeholder="Ingresá tu nombre"
                            maxlength="100"
                            required
                        >
                    </div>

                    <div class="grupo-input">
                        <label for="email">Correo electrónico</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Ingresá tu correo"
                            maxlength="150"
                            required
                        >
                    </div>

                    <div class="grupo-input">
                        <label for="password">Contraseña</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Mínimo 6 caracteres"
                            minlength="6"
                            required
                        >
                    </div>

                    <div class="grupo-input">
                        <label for="confirmar-password">
                            Confirmar contraseña
                        </label>

                        <input
                            type="password"
                            id="confirmar-password"
                            placeholder="Repetí tu contraseña"
                            required
                        >
                    </div>

                    <button type="submit" class="boton-registro">
                        CREAR CUENTA →
                    </button>

                    <p id="mensaje-registro" class="mensaje"></p>

                </form>

                <p class="registro">
                    ¿Ya tenés una cuenta?
                    <a href="login.html">Iniciá sesión</a>
                </p>

            </div>

        </section>

    </main>

</body>
</html>
