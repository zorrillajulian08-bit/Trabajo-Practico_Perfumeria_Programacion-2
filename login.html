<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Emprendimiento May</title>

    <link rel="stylesheet" href="css/login.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/auth.js"></script>
</head>
<body>

    <main class="contenedor-login">

        <section class="panel-formulario">

            <div class="contenido-login">

                <a href="index.html" class="volver">← Volver al inicio</a>

                <div class="marca">
                    <h1>EMPRENDIMIENTO MAY</h1>
                    <span>PERFUMERÍA</span>
                </div>

                <p class="subtitulo">BIENVENIDO/A</p>

                <h2>Iniciar sesión</h2>

                <p class="descripcion">
                    Ingresá tus datos para acceder a nuestra tienda.
                </p>

                <form id="form-login">

                    <label for="email">Correo electrónico</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Ingresá tu correo"
                        required
                    >

                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresá tu contraseña"
                        required
                    >

                    <label class="label-rol">Ingresar como</label>

                    <div class="selector-roles">

                        <button
                            type="button"
                            class="boton-rol seleccionado"
                            data-rol="cliente"
                        >
                            CLIENTE
                        </button>

                        <button
                            type="button"
                            class="boton-rol"
                            data-rol="empleado"
                        >
                            EMPLEADO
                        </button>

                    </div>

                    <input type="hidden" id="rol-login" value="cliente">

                    <button type="submit" class="boton-login">
                        INGRESAR →
                    </button>

                    <p id="mensaje-login"></p>

                </form>

                <p class="registro">
                    ¿No tenés una cuenta?
                    <a href="registro.html">Registrate acá</a>
                </p>

            </div>

        </section>

        <section class="panel-imagen">

            <div class="frase">
                <h2>El aroma que te representa.</h2>
                <p>Descubrí una esencia para cada ocasión.</p>
            </div>

        </section>

    </main>

</body>
</html>
