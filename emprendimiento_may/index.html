<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emprendimiento May | Perfumería</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="encabezado">
    <a class="logo" href="index.html">Emprendimiento <span>May</span></a>
    <nav><a href="#inicio">Inicio</a><a href="#catalogo">Catálogo</a></nav>
  </header>
  <main>
    <section class="portada" id="inicio">
      <p class="etiqueta">EMPRENDIMIENTO MAY</p>
      <h1>Encontrá tu próxima <span>fragancia</span></h1>
      <p>Descubrí perfumes para cada estilo y ocasión.</p>
      <a class="boton" href="#catalogo">Ver catálogo</a>
    </section>
    <section class="catalogo" id="catalogo">
      <p class="etiqueta">NUESTRA SELECCIÓN</p><h2>Catálogo de perfumes</h2>
      <div class="filtros">
        <input id="buscador" type="search" placeholder="Buscar perfume o marca...">
        <select id="categoria">
          <option value="Todos">Todas las categorías</option>
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
          <option value="Unisex">Unisex</option>
        </select>
      </div>
      <div class="productos" id="productos"></div>
      <p id="sin-resultados" hidden>No encontramos perfumes con esa búsqueda.</p>
    </section>
  </main>
  <footer>© 2026 Emprendimiento May · Perfumería</footer>
</body>
</html>
